[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "apprentice"
version = "0.1.0"
description = "Small open models that learn from big open models: an OpenAI-compatible gateway with routing, memory, a trained judge, and an MCP server."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
# The base install is just the MCP server (`apprentice-mcp`), which talks to a running gateway
# over HTTP. The gateway itself runs from a clone of the repo: `pip install -r requirements.txt`.
dependencies = ["httpx>=0.27", "mcp>=2.3"]

[project.optional-dependencies]
gateway = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "python-dotenv>=1.0", "numpy>=2.1"]

[project.scripts]
apprentice-mcp = "apprentice.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Ayush-e4/apprentice"
Documentation = "https://github.com/Ayush-e4/apprentice/blob/main/docs/mcp.md"

[tool.setuptools.packages.find]
include = ["apprentice*", "bench*"]
